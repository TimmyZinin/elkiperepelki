<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ёлкино-Перепёлкино — 3D-план базы</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#bfe3ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #c{display:block;width:100%;height:100%;outline:none}
  #loader{position:fixed;inset:0;background:#eaf6ff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .6s}
  #loader.hide{opacity:0;pointer-events:none}
  #bar{width:240px;height:8px;background:#cde3f2;border-radius:6px;overflow:hidden;margin-top:14px}
  #barfill{height:100%;width:0;background:#2f9e44;transition:width .25s}
  #loader h2{color:#2b6a3f;font-weight:700}
  #loader p{color:#5a7d8c;margin-top:6px;font-size:14px}
  #hint{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:rgba(255,255,255,.85);
        padding:8px 16px;border-radius:20px;color:#2b5a3a;font-size:14px;font-weight:600;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  /* object label tags */
  .tag{position:fixed;transform:translate(-50%,-100%);background:rgba(20,40,25,.82);color:#fff;
       padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600;pointer-events:none;white-space:nowrap;z-index:15;
       transition:opacity .2s;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  /* booking card */
  #card{position:fixed;right:18px;top:18px;width:300px;max-width:calc(100% - 36px);background:#fff;border-radius:18px;
        box-shadow:0 10px 40px rgba(0,0,0,.25);z-index:30;overflow:hidden;display:none;animation:pop .25s ease}
  @keyframes pop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
  #card .ph{height:160px;background:#dce8d8 center/cover no-repeat;position:relative}
  #card .x{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);
           color:#fff;border:none;font-size:18px;cursor:pointer;line-height:30px}
  #card .body{padding:16px 18px 20px}
  #card h3{font-size:20px;color:#22351f;margin-bottom:6px}
  #card .desc{font-size:14px;color:#5b6b56;line-height:1.45;margin-bottom:12px}
  #card .price{font-size:15px;color:#2f7d3a;font-weight:700;margin-bottom:14px}
  #card a.book{display:block;text-align:center;background:#2f9e44;color:#fff;padding:12px;border-radius:12px;
               font-weight:700;text-decoration:none}
  #card a.book:active{background:#268038}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Крутите пальцем/мышью · нажмите на объект</div>
<div id="loader"><h2>Ёлкино-Перепёлкино</h2><p id="lp">Загружаю 3D-базу…</p><div id="bar"><div id="barfill"></div></div></div>
<div id="card">
  <div class="ph" id="cph"><button class="x" id="cx">×</button></div>
  <div class="body"><h3 id="ch"></h3><div class="desc" id="cd"></div><div class="price" id="cpr"></div>
  <a class="book" id="cb" href="#book">Забронировать</a></div>
</div>

<script type="importmap">

  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",

}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';

// ---- object layout (from Misha's 3D Max top-view) ----
// x = west(-)→east(+), z = north(-)→south(+), w = target footprint width (m), rotY in deg
// coords mapped from Misha's 3D Max top-view + red-dot scheme; objects sit BETWEEN the road-loop and the trees.
// world ground 150(X) x 210(Z); path loop ±42 X / ±50 Z; trees beyond ±62. facade rot deg.
const OBJECTS = [
  // facade rotations tuned so each building faces the nearest road segment (loop ±42X/±50Z)
  {f:'wood_house',  name:'Деревянный дом', x: 8,  z:-60, w:17, rot:270, price:'от 12 000 ₽/сутки',
   desc:'Уютный бревенчатый дом с балконом и крытой верандой.', photo:'../img/derevyanny/derevyanny_1.webp'},
  {f:'apartament',  name:'Апартаменты',    x:-54, z:-10, w:32, rot:0,   price:'от 6 000 ₽/сутки',
   desc:'Номера в основном корпусе со всеми удобствами.', photo:'../img/apartament/apartament_1.webp'},
  // banya + chan moved BEHIND wood house, deeper north
  {f:'banya',       name:'Баня',           x:-11, z:-108, w:19, rot:180,  price:'от 3 000 ₽/час',
   desc:'Настоящая русская баня на дровах.', photo:'../img/banya/banya_1.webp'},
  {f:'chan',        name:'Чан',            x:-31, z:-122, w:8,  rot:0,   price:'6 500 ₽ / 2 ч (до 6, с кино)',
   desc:'Горячий чан на дровах под открытым небом.', photo:'../img/chan/chan_1.webp'},
  {f:'pool',        name:'Бассейн',        x:-54, z:-50, w:14, rot:0, xz:1.2, price:'для гостей базы',
   desc:'Открытый бассейн с чистой водой.', photo:'../img/ambient/dad_pool_20240601.webp'},
  {f:'polish_house',name:'Польский дом',   x: 26, z: 36, w:16, rot:0,   price:'от 10 000 ₽/сутки',
   desc:'Каркасный дом в скандинавско-польском стиле.', photo:'../img/polskiy/polskiy_1.webp'},
  // 3 Scandinavian glamping pods on the RIGHT (between road and trees), facade facing the road (west, -X)
  {f:'skandinavsky',name:'Скандинавский дом №1',x:53, z: -8, w:13, rot:180, price:'от 9 000 ₽/сутки',
   desc:'Скандинавский глэмпинг-домик с подиумом.', photo:'../img/skandinavsky/misha_pkg_30.webp'},
  {f:'skandinavsky',name:'Скандинавский дом №2',x:53, z: 10, w:13, rot:180, price:'от 9 000 ₽/сутки',
   desc:'Скандинавский глэмпинг-домик с подиумом.', photo:'../img/skandinavsky/misha_pkg_30.webp'},
  {f:'skandinavsky',name:'Скандинавский дом №3',x:53, z: 28, w:13, rot:180, price:'от 9 000 ₽/сутки',
   desc:'Скандинавский глэмпинг-домик с подиумом.', photo:'../img/skandinavsky/misha_pkg_30.webp'},
  // playground moved to the old banya/chan spot (top-left, by the road)
  {f:'playground',  name:'Игровая площадка',x:28, z:-14, w:19.4, rot:0, mirror:true, price:'бесплатно',
   desc:'Детская площадка с горкой и качелями.', photo:'../img/ambient/swing_beach_20230618.webp'},
  // two BBQ "kota" grill cabins, EAST of the wood house, OUTSIDE the road loop (north strip)
  {f:'kota',        name:'Барбекю-домик «Кота»',x:50, z:-91, w:14, rot:245, price:'от 4 000 ₽/час',
   desc:'Гриль-домик «Кота»: восьмигранный сруб, мангал в центре, тёплый очаг. Для компании до 12 человек.', photo:'../img/kota/kota_1.jpg'},
  {f:'kota',        name:'Барбекю-домик «Кота» (малый)',x:59, z:-58, w:11, rot:135, price:'от 3 000 ₽/час',
   desc:'Уютный гриль-домик «Кота» для небольшой компании до 6 человек.', photo:'../img/kota/kota_1.jpg'},
  // rabbit petting enclosure 6x6 — top-left corner, north of the pool
  {f:'rabbit',      name:'Зоопарк (кролики)', x:-51, z:-74, w:10, rot:0, price:'вход свободный',
   desc:'Контактный мини-зоопарк: кролики на травке, кормление с рук. Радость для детей.', photo:'../img/rabbit/rabbit_1.jpg'},
  // volleyball court — near the apartments
  {f:'volley',      name:'Волейбольная площадка', x:-55, z:27, w:18, rot:90, price:'бесплатно',
   desc:'Волейбольная площадка с сеткой на свежем воздухе — для активного отдыха компанией.', photo:'../img/volley/volley_1.jpg'},
  // summer outdoor cinema screen 4x3m — between the two BBQ kota cabins (will fine-tune spot later)
  {f:'cinema_screen', name:'Летний кинотеатр', x:70, z:-80, w:10, rot:90, price:'бесплатно',
   desc:'Летний киноэкран под открытым небом — вечерние показы для гостей базы.', photo:'../img/cinema/cinema_1.jpg'},
  // second hot tub (chan), same model, next to the cinema screen
  {f:'chan',        name:'Чан №2',           x:70, z:-88, w:8,  rot:0,   price:'7 500 ₽ / 2 ч (до 8)',
   desc:'Горячий чан на дровах под открытым небом — у летнего кинотеатра.', photo:'../img/chan/chan_1.webp'},
  // 6 white sun loungers — west part of the main lawn, near the road, facing the pool
  {f:'lounger',     name:'Шезлонги', x:-36, z:-30, w:2.3, rot:180, price:'бесплатно',
   desc:'Белые шезлонги на газоне напротив бассейна — позагорать и отдохнуть.', photo:'../img/lounger/lounger_1.jpg'},
  {f:'lounger',     name:'Шезлонги', x:-36, z:-26, w:2.3, rot:180, price:'бесплатно',
   desc:'Белые шезлонги на газоне напротив бассейна — позагорать и отдохнуть.', photo:'../img/lounger/lounger_1.jpg'},
  {f:'lounger',     name:'Шезлонги', x:-36, z:-22, w:2.3, rot:180, price:'бесплатно',
   desc:'Белые шезлонги на газоне напротив бассейна — позагорать и отдохнуть.', photo:'../img/lounger/lounger_1.jpg'},
  {f:'lounger',     name:'Шезлонги', x:-36, z:-18, w:2.3, rot:180, price:'бесплатно',
   desc:'Белые шезлонги на газоне напротив бассейна — позагорать и отдохнуть.', photo:'../img/lounger/lounger_1.jpg'},
  {f:'lounger',     name:'Шезлонги', x:-36, z:-14, w:2.3, rot:180, price:'бесплатно',
   desc:'Белые шезлонги на газоне напротив бассейна — позагорать и отдохнуть.', photo:'../img/lounger/lounger_1.jpg'},
  {f:'lounger',     name:'Шезлонги', x:-36, z:-10, w:2.3, rot:180, price:'бесплатно',
   desc:'Белые шезлонги на газоне напротив бассейна — позагорать и отдохнуть.', photo:'../img/lounger/lounger_1.jpg'},
  // 5 parking spaces in a row (side by side, like a mall lot), in front of the road on the polish-house side, hoods facing the wood house (north)
  {f:'car', name:'Парковка', x:-20, z:58, w:8.4, rot:180, price:'для гостей базы',
   desc:'Парковка для гостей — места рядом с въездом со стороны польского дома.', photo:'../img/car/car_1.jpg'},
  {f:'car', name:'Парковка', x:-7, z:58, w:8.4, rot:180, price:'для гостей базы',
   desc:'Парковка для гостей — места рядом с въездом со стороны польского дома.', photo:'../img/car/car_1.jpg'},
  {f:'car', name:'Парковка', x:6, z:58, w:8.4, rot:180, price:'для гостей базы',
   desc:'Парковка для гостей — места рядом с въездом со стороны польского дома.', photo:'../img/car/car_1.jpg'},
  {f:'car', name:'Парковка', x:19, z:58, w:8.4, rot:180, price:'для гостей базы',
   desc:'Парковка для гостей — места рядом с въездом со стороны польского дома.', photo:'../img/car/car_1.jpg'},
  {f:'car', name:'Парковка', x:32, z:58, w:8.4, rot:180, price:'для гостей базы',
   desc:'Парковка для гостей — места рядом с въездом со стороны польского дома.', photo:'../img/car/car_1.jpg'},
];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3ff);
scene.fog = new THREE.Fog(0xbfe3ff, 180, 340);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.5, 1000);
camera.position.set(60, 80, 130);

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI/2.15;
controls.minDistance = 25;
controls.maxDistance = 260;
controls.target.set(0,0,0);

// ---- lights ----
const hemi = new THREE.HemisphereLight(0xffffff, 0x88aa66, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 1.5);
sun.position.set(80, 140, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const s=180; sun.shadow.camera.left=-s;sun.shadow.camera.right=s;sun.shadow.camera.top=s;sun.shadow.camera.bottom=-s;
sun.shadow.camera.far=400; sun.shadow.bias=-0.0004;
scene.add(sun);

// ---- ground (lawn) ----
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 360),
  new THREE.MeshStandardMaterial({color:0x6fae42, roughness:1})
);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// central lawn lighter patch (inside the road loop)
const lawn = new THREE.Mesh(new THREE.PlaneGeometry(80,96),
  new THREE.MeshStandardMaterial({color:0x86c14f, roughness:1}));
lawn.rotation.x=-Math.PI/2; lawn.position.y=0.02; lawn.receiveShadow=true; scene.add(lawn);

// ---- path loop (brown) — smaller rectangle so buildings sit OUTSIDE it (between road and trees) ----
function path(w,d,x,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,0.3,d),
  new THREE.MeshStandardMaterial({color:0x9c6b3f,roughness:1}));m.position.set(x,0.05,z);m.receiveShadow=true;scene.add(m);}
path(90,6,0,-50); path(90,6,0,50); path(6,106,-42,0); path(6,106,42,0); // loop ±42 X / ±50 Z

// ---- Volga (water strip, far west) ----
const water = new THREE.Mesh(new THREE.PlaneGeometry(28,360),
  new THREE.MeshStandardMaterial({color:0x3d83b8,roughness:0.3,metalness:0.1}));
water.rotation.x=-Math.PI/2; water.position.set(-92,0.03,0); scene.add(water);

// ---- trees (cones) — pushed outward so buildings fit between road and trees ----
const treeGeo = new THREE.ConeGeometry(3.2, 11, 7);
const treeMat = new THREE.MeshStandardMaterial({color:0x2f7d3a, roughness:1});
const trunkGeo = new THREE.CylinderGeometry(0.6,0.8,4,6);
const trunkMat = new THREE.MeshStandardMaterial({color:0x6b4a2b, roughness:1});
function tree(x,z){const g=new THREE.Group();
  const c=new THREE.Mesh(treeGeo,treeMat);c.position.y=9;c.castShadow=true;
  const t=new THREE.Mesh(trunkGeo,trunkMat);t.position.y=2;
  g.add(t,c);g.position.set(x,0,z);g.scale.setScalar(0.8+Math.abs(Math.sin(x*z))*0.5);scene.add(g);}
for(let z=-78; z<=78; z+=11) tree(-72, z);              // left column (by Volga)
for(let x=-66; x<=66; x+=12) tree(x, 86);               // bottom row
for(let x=66; x<=76; x+=8) for(let z=-46;z<=46;z+=15) tree(x+(z%2?3:0), z); // right grove (behind pods)

// ---- load models ----
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const raycTargets = [];
let loaded = 0;
const total = OBJECTS.length;
const lp = document.getElementById('lp'), barfill=document.getElementById('barfill');

function place(gltf, cfg){
  const root = gltf.scene;
  const box = new THREE.Box3().setFromObject(root);
  const size = new THREE.Vector3(); box.getSize(size);
  const scale = cfg.w / Math.max(size.x, size.z);
  root.scale.setScalar(scale);
  // optional horizontal stretch (width+length) without changing height
  if(cfg.xz){ root.scale.x *= cfg.xz; root.scale.z *= cfg.xz; }
  // optional horizontal mirror (left-right flip, stays upright)
  if(cfg.mirror){ root.scale.x *= -1; }
  // recompute, sit on ground, center
  const box2 = new THREE.Box3().setFromObject(root);
  const c = new THREE.Vector3(); box2.getCenter(c);
  const min = box2.min;
  root.position.x += cfg.x - c.x;
  root.position.z += cfg.z - c.z;
  root.position.y += -min.y;
  root.rotation.y = THREE.MathUtils.degToRad(cfg.rot||0);
  root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.userData.cfg=cfg;
    if(cfg.mirror){ const ms=Array.isArray(o.material)?o.material:[o.material]; ms.forEach(m=>{if(m)m.side=THREE.DoubleSide;}); }}});
  root.userData.cfg = cfg;
  scene.add(root);
  raycTargets.push(root);
}

OBJECTS.forEach(cfg=>{
  loader.load('models/web/'+cfg.f+'.glb', g=>{
    place(g, cfg);
    loaded++; barfill.style.width=(loaded/total*100)+'%'; lp.textContent=`Загружаю объекты… ${loaded}/${total}`;
    if(loaded===total){ setTimeout(()=>document.getElementById('loader').classList.add('hide'),400); }
  }, undefined, err=>{ console.error('load fail',cfg.f,err); loaded++; barfill.style.width=(loaded/total*100)+'%';
    if(loaded===total) document.getElementById('loader').classList.add('hide'); });
});

// ---- raycast click → card ----
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const card=document.getElementById('card');
function showCard(cfg){
  document.getElementById('ch').textContent=cfg.name;
  document.getElementById('cd').textContent=cfg.desc;
  document.getElementById('cpr').textContent=cfg.price;
  const ph=document.getElementById('cph');
  if(cfg.photo){ ph.style.backgroundImage=`url('${cfg.photo}')`; ph.style.display='block'; }
  else ph.style.display='none';
  card.style.display='block';
}
document.getElementById('cx').onclick=()=>card.style.display='none';
function pick(cx,cy){
  mouse.x=(cx/innerWidth)*2-1; mouse.y=-(cy/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(raycTargets,true);
  if(hits.length){let o=hits[0].object;while(o&&!o.userData.cfg)o=o.parent;if(o&&o.userData.cfg)showCard(o.userData.cfg);}
}
let downX,downY;
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;});
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-downX,e.clientY-downY)<6) pick(e.clientX,e.clientY);
});

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
</script>
